name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dsh_test
          POSTGRES_PASSWORD: dsh_test_local
          POSTGRES_DB: dsh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dsh_test -d dsh_test"
          --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.5.1
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
        env:
          DSH_PG_TEST_URL: postgresql://dsh_test:dsh_test_local@127.0.0.1:5432/dsh_test
      - run: npm run build
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: node -e "const expected = process.env.TAG_VERSION.replace(/^v/, ''); const actual = require('./package.json').version; if (expected !== actual) throw new Error('tag ' + expected + ' does not match package version ' + actual)"
      - run: npm publish --access public --tag next
